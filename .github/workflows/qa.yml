name: QA deployed site
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the deployed site to test'
        required: false
        default: 'https://art-history-museum-blue-ocean4.vercel.app'
  push:
    branches: [main]
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || secrets.BASE_URL || 'https://art-history-museum-blue-ocean4.vercel.app' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }
